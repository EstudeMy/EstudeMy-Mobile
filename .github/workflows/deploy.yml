name: EstudeMy Cloud CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. Validação Estática (Lint, Typecheck e Build da SPA Web)
  # ============================================================================
  validate:
    name: 🔍 Lint, Typecheck & Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Verificação de Linting
        run: npm run lint

      - name: Verificação de Tipos TypeScript (TypeCheck)
        run: npx tsc --noEmit

      - name: Validação do Build SPA Expo Web
        run: npx expo export -p web

  # ============================================================================
  # 2. Build Multi-stage & Publicação de Imagens Docker no GHCR
  # ============================================================================
  build-and-push:
    name: 🐳 Build Docker Multi-stage & GHCR Push
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados e Tags Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e Push da Imagem Mobile Nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EXPO_PUBLIC_API_URL=https://api.estudemy.com

  # ============================================================================
  # 3. Deploy Remoto na Nuvem AWS / Host via SSH
  # ============================================================================
  deploy:
    name: 🚀 Deploy Remoto na Nuvem (AWS EC2)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Validar Configuração de Secrets
        run: |
          if [ -z "${{ secrets.CLOUD_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Secret CLOUD_SSH_PRIVATE_KEY não está configurada no repositório!"
            echo "Configure o conteúdo do arquivo C:\AWS\EstudeMy.pem em Settings > Secrets and variables > Actions > CLOUD_SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "✅ Secret CLOUD_SSH_PRIVATE_KEY configurada."

      - name: Executar Deploy no Servidor Host via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST || '18.222.3.101' }}
          username: ${{ secrets.CLOUD_SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.CLOUD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CLOUD_SSH_PORT || 22 }}
          timeout: 45s
          script_stop: true
          script: |
            echo "Conectado ao servidor host: $(hostname)"
            
            # Navegar até o diretório do projeto
            if [ -d "/home/ubuntu/estudemy_deploy" ]; then
              cd /home/ubuntu/estudemy_deploy
            elif [ -d "/opt/estudemy" ]; then
              cd /opt/estudemy
            else
              echo "❌ Diretório de deploy não encontrado!"
              exit 1
            fi

            # Login no GHCR caso o pacote seja privado
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            echo "Baixando a versão recém-compilada da imagem Mobile..."
            docker pull ghcr.io/estudemy/estudemy-mobile:latest
            docker tag ghcr.io/estudemy/estudemy-mobile:latest estudemy/mobile:latest || true

            echo "Atualizando contêiner do Mobile (sem downtime nos outros serviços)..."
            docker compose up -d --no-deps --force-recreate mobile

            echo "Aguardando inicialização para verificação de saúde..."
            sleep 10
            if curl -s -f http://127.0.0.1:80/ > /dev/null; then
              echo "✅ Deploy concluído com sucesso! Serviços operacionais e saudáveis."
            else
              echo "❌ Falha no healthcheck pós-deploy! Logs:"
              docker compose logs --tail=50 mobile
              exit 1
            fi
