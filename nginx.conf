# ==============================================================================
# Nginx Configuration - EstudeMy Web & Security Hardening
# Implementação de Controles de Segurança:
# - RC02: Content-Security-Policy (CSP) & Cabeçalhos Anti-XSS
# - RC04 & RC08: Rate Limiting por IP, Conexões Concorrentes & Anti-Slowloris
# - RC10: Ocultação de Versão (server_tokens off) & Headers de Proteção HSTS/LGPD
# - RC11: Bloqueio estrito de Directory Traversal e Arquivos Sensíveis (.env, .git)
# ==============================================================================

# Zonas de Limitação de Taxa (Rate Limiting) - Mitigação de Brute Force (RC04) e DDoS (RC08)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # RC10: Ocultar versão do servidor Nginx
    server_tokens off;

    # RC08: Timeouts estritos contra ataques Slowloris
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;

    # Limite de conexões concorrentes por IP (RC08)
    limit_conn conn_limit 30;

    # ==========================================================================
    # Cabeçalhos Globais de Segurança (AppSec / OWASP Top 10)
    # ==========================================================================
    # RC02: Prevenção de XSS e Restrição de Origens Confiáveis (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://estudemydocker.onrender.com http://localhost:5000 ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Proteções complementares contra sniffing, clickjacking e vazamento de referrer (RC02, RC10)
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ==========================================================================
    # RC11: Bloqueio Rigoroso de Directory Traversal e Arquivos Sensíveis
    # ==========================================================================
    # Bloqueia qualquer tentativa de manipulação de caminhos com ../ ou %2e%2e
    location ~* (\.\./|\.\.\\|%2e%2e) {
        return 403 "Acesso Negado: Tentativa de Directory Traversal detectada.";
    }

    # Bloqueia arquivos e pastas ocultas (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Bloqueia arquivos de configuração e código sensível
    location ~* \.(env|git|yml|yaml|json|conf|md|sh|lock|dockerignore|dockerfile)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Compressão Gzip para carregamento ultrarrápido
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache de arquivos estáticos (imagens, fontes, bundles JS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # RC04: Proteção específica de Rate Limiting para rotas de autenticação
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:5000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para a API do backend (evita problemas de CORS com rate limit)
    location /api/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Roteamento SPA do Expo Router (procura arquivo direto, arquivo .html ou cai no index.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Página de erro 404 personalizada
    error_page 404 /+not-found.html;
    error_page 429 /429.html;
    error_page 403 /403.html;
}
