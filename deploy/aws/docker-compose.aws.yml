# Stack enxuta para a EC2 de 1 GB (sem Grafana/Prometheus).
# Mongo ja existente na rede estudemy_net (container estudemy_mongo).

services:
  backend:
    image: ghcr.io/estudemy/estudemy-backend-ts:latest
    container_name: estudemy_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      APP_ENV: production
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://18.222.3.101:3000
      BACKEND_URL: http://18.222.3.101:5000
    networks:
      - estudemy_net

  mobile:
    image: estudemy-mobile:aws
    container_name: estudemy_mobile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - estudemy_net

  frontend:
    image: estudemy-frontend:aws
    container_name: estudemy_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - estudemy_net

networks:
  estudemy_net:
    external: true
    name: estudemy_net
