services:
  mongo:
    image: mongo:7.0
    container_name: estudemy_mongo
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-aB3dE5fG7hJ9kL2mN4pQ6rS8}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-estudemy}
      MONGO_APP_USER: ${MONGO_APP_USER:-estudemy_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - estudemy_prod_mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - estudemy_net

  backend:
    image: estudemy/backend:latest
    container_name: estudemy_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      APP_ENV: production
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://18.222.3.101:3000
      BACKEND_URL: http://18.222.3.101:5000
    depends_on:
      - mongo
    networks:
      - estudemy_net

  frontend:
    image: estudemy/frontend:latest
    container_name: estudemy_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - estudemy_net

  mobile:
    image: estudemy/mobile:latest
    container_name: estudemy_mobile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - estudemy_net

volumes:
  estudemy_prod_mongo_data:
    external: true

networks:
  estudemy_net:
    external: true
    name: estudemy_net

