# ==============================================================================
# Nginx Production Configuration - EstudeMy Cloud Infrastructure
# Implementação de Requisitos da Arquitetura TO-BE (Seções 7 e 8):
# - Porta 80: Redirecionamento 301 obrigatório para HTTPS (443)
# - Porta 443: Terminação SSL/TLS 1.3, HTTP/2 e Certificados Seguros
# - Rate Limiting por IP (Mitigação de Brute Force e DDoS - RC04/RC08)
# - Headers de Segurança OWASP (CSP, HSTS, Anti-Sniff, Anti-Clickjacking)
# - Bloqueio contra Directory Traversal e Arquivos Sensíveis (.env, .git)
# - Proxy Reverso para API Backend isolada na Subnet Privada (:5000)
# - Roteamento SPA nativo do Expo Router
# ==============================================================================

# Zonas de Rate Limiting
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ------------------------------------------------------------------------------
# 1. Servidor HTTP (Porta 80) -> Redirecionamento 301 Obrigatório para HTTPS (443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Desafio ACME Let's Encrypt para renovação automática de certificados
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionamento 301 para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Servidor Seguro HTTPS (Porta 443) - Produção
# ------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Ocultação da versão do Nginx (RC10)
    server_tokens off;

    # Certificados SSL/TLS (Let's Encrypt ou Certificados Corporativos)
    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

    # Protocolos e Ciphers Seguros (TLS 1.2 e TLS 1.3 apenas)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Timeouts Estritos contra Ataques Slowloris (RC08)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    client_max_body_size 15M;

    # Limite de Conexões Concorrentes por IP
    limit_conn conn_limit 30;

    # ==========================================================================
    # Cabeçalhos Globais de Segurança (OWASP / AppSec)
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: http://localhost:5000 ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ==========================================================================
    # Bloqueio de Directory Traversal e Arquivos Sensíveis (RC11)
    # ==========================================================================
    location ~* (\.\./|\.\.\\|%2e%2e) {
        return 403 "Acesso Negado: Tentativa de Directory Traversal detectada.";
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(env|git|yml|yaml|json|conf|md|sh|lock|dockerignore|dockerfile)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Cache de Assets Estáticos do Expo (Imagens, Fontes, Bundles JS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # ==========================================================================
    # Proxy Reverso para a API Backend (Subnet Privada estudemy_backend:5000)
    # ==========================================================================
    
    # Rota de Autenticação com Rate Limiting Rigoroso (5 req/min)
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:5000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota Geral da API Backend (30 req/s)
    location /api/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de Healthcheck exposto diretamente para Load Balancer
    location /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Endpoint de Métricas do Nginx (Coleta pelo Prometheus)
    location /stub_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.0.0.0/16;
        allow 172.16.0.0/12;
        deny all;
    }

    # Roteamento SPA do Expo Router (Fallback para index.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /+not-found.html;
}
