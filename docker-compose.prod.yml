# ==============================================================================
# Docker Compose - EstudeMy Produção em Nuvem (Arquitetura TO-BE)
# Ambiente de Execução Homologado: Ubuntu Server 24.04 LTS (OCI Free Tier / AWS)
#
# Serviços da Stack:
# 1. estudemy_mongo     - MongoDB 7.0 Community com autenticação e volume de 200 GB
# 2. estudemy_backend   - Node.js 22 LTS + Express 5 + Swagger + Healthcheck /health
# 3. estudemy_mobile    - Expo Web SPA servido por Nginx Alpine com HTTPS (443/80)
# 4. estudemy_cadvisor  - Coletor de métricas de contêineres em tempo real
# 5. estudemy_prometheus- Coleta de métricas e alertas automáticos (CPU > 80%)
# 6. estudemy_grafana   - Dashboards visuais e monitoramento contínuo
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados NoSQL - MongoDB 7.0 Community Edition (Subnet Privada)
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: estudemy_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-estudemy_root_superpass_2026}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-estudemy}
    volumes:
      # Block Volume Persistente de 200 GB SSD NVMe (Montado no host em /mnt/estudemy-data/mongo)
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 2G
    networks:
      - estudemy_net

  # ----------------------------------------------------------------------------
  # 2. API Backend RESTful - Node.js 22 LTS + Express 5 (Subnet Privada)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../EstudeMy-BackEnd-TS
      dockerfile: Dockerfile
    image: ghcr.io/estudemy/backend:latest
    container_name: estudemy_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      APP_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_APP_USER:-estudemy_app}:${MONGO_APP_PASSWORD:-estudemy_pass_2026}@mongo:27017/${MONGO_DATABASE:-estudemy}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-estudemy_super_secure_production_jwt_secret_key_2026}
      FRONTEND_URL: ${FRONTEND_URL:-https://estudemy.site}
      BACKEND_URL: ${BACKEND_URL:-https://api.estudemy.site}
      BETTER_STACK_SOURCE_TOKEN: ${BETTER_STACK_SOURCE_TOKEN:-}
      BETTER_STACK_SERVICE_NAME: ${BETTER_STACK_SERVICE_NAME:-estudemy-backend-cloud}
      BETTER_STACK_INGEST_URL: ${BETTER_STACK_INGEST_URL:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || wget -qO- http://127.0.0.1:5000/ || curl -f http://127.0.0.1:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 12G
        reservations:
          cpus: '0.5'
          memory: 2G
    networks:
      - estudemy_net

  # ----------------------------------------------------------------------------
  # 3. Mobile Web SPA + Nginx Proxy Reverso & SSL (Borda / Subnet Pública DMZ)
  # ----------------------------------------------------------------------------
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://api.estudemy.site}
    image: ghcr.io/estudemy/mobile:latest
    container_name: estudemy_mobile
    restart: unless-stopped
    ports:
      # Portas públicas liberadas na DMZ / Security List
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/live:/etc/nginx/ssl/live:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 4G
        reservations:
          cpus: '0.2'
          memory: 512M
    networks:
      - estudemy_net

  # ----------------------------------------------------------------------------
  # 4. Observabilidade: cAdvisor (Métricas de Recursos dos Contêineres)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: estudemy_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - estudemy_net

  # ----------------------------------------------------------------------------
  # 5. Observabilidade: Prometheus (Coleta de Métricas e Regras de Alerta)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: estudemy_prometheus
    restart: unless-stopped
    ports:
      # Porta interna/VPN restrita
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - cadvisor
    networks:
      - estudemy_net

  # ----------------------------------------------------------------------------
  # 6. Observabilidade: Grafana (Painel Visual de Métricas em Tempo Real)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: estudemy_grafana
    restart: unless-stopped
    ports:
      # Acesso ao painel administrativo (porta 3000)
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-estudemy_grafana_pass_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - estudemy_net

# ==============================================================================
# Volumes Persistentes (Mapeados no Block Volume de 200 GB SSD NVMe)
# ==============================================================================
volumes:
  mongo_data:
    name: estudemy_prod_mongo_data
  prometheus_data:
    name: estudemy_prod_prometheus_data
  grafana_data:
    name: estudemy_prod_grafana_data

# ==============================================================================
# Rede Interna Isolada (Docker Bridge Network)
# ==============================================================================
networks:
  estudemy_net:
    name: estudemy_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
